<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Shrink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column on near-black — stage, trim strip, shrink button. Deliberately single-theme (dark). */
:root {
  color-scheme: dark;
  --bg: #0a0a0c;
  --ink: #f3f3f5;
  --muted: #7d808b;
  --line: #23232a;
  --soft: #131317;
  --soft-hover: #1a1a20;
  --line-hover: #34343d;
  --trim: #ffc933;
  --trim-ink: #2a1f00;
  --ok: #34d17f;
  --bad: #ff6a5f;
  --sans: "Geist", "SF Pro Text", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: 100%; max-width: 560px; display: grid; gap: 12px; }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; display: flex; align-items: center; gap: 8px; }
h1 i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); display: inline-block; }
.link { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px; }
.link:hover { color: var(--ink); }

.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 20px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; text-align: center; overflow: hidden; transition: background .2s, border-color .2s; }
.stage.empty { cursor: pointer; }
.stage.empty:hover, .stage.over { background: var(--soft-hover); border-color: var(--line-hover); }
.stage:focus-within { outline: 2px solid var(--ink); outline-offset: 3px; }
.stage input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.stage.loaded input { pointer-events: none; }
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; cursor: pointer; }
.hint { display: grid; gap: 10px; justify-items: center; pointer-events: none; padding: 16px; }
.hint svg { width: 34px; height: 34px; stroke: var(--ink); }
.hint b { font-weight: 500; font-size: 16px; }
.hint span { color: var(--muted); font-size: 13px; }

/* trim strip */
.trim { display: flex; gap: 10px; align-items: stretch; height: 64px; }
.play { flex: 0 0 64px; border: 0; border-radius: 14px; background: var(--soft); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.play:hover { background: var(--soft-hover); }
.play svg { width: 22px; height: 22px; fill: currentColor; }
.strip { position: relative; flex: 1; min-width: 0; border-radius: 12px; background: var(--soft); touch-action: none; cursor: pointer; }
.frames { position: absolute; inset: 4px 14px; display: flex; overflow: hidden; border-radius: 4px; }
.frames canvas { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }
.shade { position: absolute; top: 4px; bottom: 4px; background: rgba(10,10,12,.72); pointer-events: none; }
.shade.l { left: 14px; } .shade.r { right: 14px; }
.sel { position: absolute; top: 0; bottom: 0; border: 3px solid var(--trim); border-left-width: 14px; border-right-width: 14px; border-radius: 10px; pointer-events: none; }
.h { position: absolute; top: -3px; bottom: -3px; width: 26px; pointer-events: auto; cursor: ew-resize; display: grid; place-items: center; outline: none; }
.h::after { content: ""; width: 3px; height: 18px; border-radius: 2px; background: var(--trim-ink); box-shadow: 0 0 0 0 transparent; }
.h.l { left: -20px; } .h.r { right: -20px; }
.h:focus-visible::after { box-shadow: 0 0 0 3px var(--ink); }
.head { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.trim.locked { pointer-events: none; opacity: .5; }
.times { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 2px; }
.times b { color: var(--trim); font-weight: 500; }

.btn { position: relative; overflow: hidden; font: inherit; font-weight: 500; font-size: 15px; height: 52px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); cursor: pointer; transition: opacity .2s, transform .1s; margin-top: 4px; }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn:disabled { opacity: .14; cursor: default; }
.btn:focus-visible, .play:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.btn .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(0,0,0,.14); transition: width .25s; }
.btn span { position: relative; }
.btn.busy { cursor: progress; opacity: 1; }
.btn.done { background: var(--ok); color: #04170c; }

.meta { min-height: 20px; margin: 0; font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; font-family: var(--mono); }
.meta.err { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <main class="card">
    <div class="top">
      <h1><i></i>Shrink</h1>
      <button class="link" id="replace" hidden>Open another</button>
    </div>

    <div class="stage empty" id="stage">
      <input type="file" id="file" accept="video/*,.mov,.mkv,.webm,.mp4" aria-label="Choose a video">
      <video id="vid" playsinline preload="auto" hidden></video>
      <div class="hint" id="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0-4 4m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <b>Drop a video</b>
        <span>or click to choose</span>
      </div>
    </div>

    <div class="trim" id="trim" hidden>
      <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
      <div class="strip" id="strip">
        <div class="frames" id="frames"></div>
        <div class="shade l" id="shadeL"></div><div class="shade r" id="shadeR"></div>
        <div class="sel" id="sel"></div>
        <span class="h l" id="hL" tabindex="0" role="slider" aria-label="Trim start"></span>
        <span class="h r" id="hR" tabindex="0" role="slider" aria-label="Trim end"></span>
        <div class="head" id="head"></div>
      </div>
    </div>
    <div class="times" id="times" hidden><span id="tIn">0:00.0</span><span><b id="tLen">0.0 s</b></span><span id="tOut">0:00.0</span></div>

    <button class="btn" id="go" disabled><i class="fill" id="fill"></i><span id="goLabel">Shrink</span></button>
    <p class="meta" id="meta">Shrinks any clip to under 10 MB for Discord.</p>
  </main>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const MB = 1e6, LIMIT = 10 * MB, TARGET = LIMIT * 0.94, MIN_LEN = 0.3, PAD = 14;
const MEDIABUNNY_URL = './mediabunny.min.mjs';
let MBN = null, src = null, busy = false, out = null, downloads = null, vidUrl = null;
let tStart = 0, tEnd = 0, thumbJob = 0;
const vid = $('vid');

const fmt = b => (b / MB).toFixed(1) + ' MB';
const fmtT = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
const even = n => Math.max(2, Math.round(n / 2) * 2);
const meta = (html, err) => { $('meta').innerHTML = html; $('meta').classList.toggle('err', !!err); };
const progress = p => { $('fill').style.width = (p * 100) + '%'; };
const label = t => { $('goLabel').textContent = t; };
const trimmed = () => src && (tStart > 0.05 || tEnd < src.duration - 0.05);
const len = () => tEnd - tStart;

function reset() {
  out = null; progress(0);
  $('go').className = 'btn'; label('Shrink');
  $('go').disabled = !src || !MBN;
}

// ---- plan: resolution, fps and bitrate picked automatically ----
function plan(s, dur, videoOverride) {
  const totalBps = TARGET * 8 / dur;
  const audioBps = s.hasAudio ? (totalBps > 1.5e6 ? 128000 : totalBps > 5e5 ? 96000 : 64000) : 0;
  const srcBps = s.size * 8 / s.duration;
  const videoBps = Math.max(60000, videoOverride ?? Math.floor(Math.min(totalBps * 0.97 - audioBps, srcBps)));
  const srcFps = Math.round(Math.min(s.fps || 30, 60));
  const fps = videoBps < 2.5e6 && srcFps > 32 ? 30 : srcFps;
  const short = Math.min(s.w, s.h), long = Math.max(s.w, s.h);
  const steps = [short, 1440, 1080, 720, 540, 480, 360, 240].filter(v => v <= short);
  let pick = steps[steps.length - 1];
  for (const v of steps) if (videoBps / (v * v * long / short * fps) >= 0.045) { pick = v; break; }
  const a = even(pick), b = even(pick * long / short);
  return { videoBps, audioBps, fps, w: s.h > s.w ? a : b, h: s.h > s.w ? b : a, srcBps };
}

function describe() {
  if (!src) return;
  const est = src.size * len() / src.duration;
  meta(est <= TARGET ? `<b>${len().toFixed(1)} s</b> · already about ${fmt(est)} — shrinking makes it smaller still`
                     : `<b>${len().toFixed(1)} s</b> · ${fmt(est)} → under <b>10 MB</b>`);
}

// ---- loading ----
async function loadFile(file) {
  if (!file || busy) return;
  if (!MBN) { meta('Still loading, try again in a second.', true); return; }
  meta('Reading…');
  try {
    const input = new MBN.Input({ source: new MBN.BlobSource(file), formats: MBN.ALL_FORMATS });
    const vt = await input.getPrimaryVideoTrack();
    if (!vt) throw new Error('That file has no video in it.');
    if (!(await vt.canDecode())) throw new Error('This browser can’t read that video. Try Chrome.');
    const at = await input.getPrimaryAudioTrack();
    const duration = await input.computeDuration();
    let fps = 30; try { fps = (await vt.computePacketStats(120)).averagePacketRate || 30; } catch {}
    src = { file, duration, w: vt.displayWidth, h: vt.displayHeight, fps, hasAudio: !!at, size: file.size, track: vt };
  } catch (e) { meta(e.message || String(e), true); return; }

  tStart = 0; tEnd = src.duration;
  if (vidUrl) URL.revokeObjectURL(vidUrl);
  vidUrl = URL.createObjectURL(file);
  vid.src = vidUrl; vid.hidden = false; vid.currentTime = 0;
  $('stage').classList.remove('empty'); $('stage').classList.add('loaded');
  $('stage').style.aspectRatio = src.w >= src.h ? `${src.w} / ${src.h}` : '';
  $('hint').hidden = true; $('trim').hidden = false; $('times').hidden = false; $('replace').hidden = false;
  document.title = file.name + ' · Shrink';
  layoutTrim(); reset(); describe();
  requestAnimationFrame(buildThumbs);
}

async function buildThumbs() {
  const job = ++thumbJob;
  const frames = $('frames'); frames.innerHTML = '';
  const box = frames.getBoundingClientRect();
  const h = Math.round(box.height * (devicePixelRatio || 1));
  const aspect = src.w / src.h;
  const n = Math.max(4, Math.min(24, Math.round(box.width / (box.height * aspect))));
  const sink = new MBN.CanvasSink(src.track, { height: h, width: Math.round(h * aspect), fit: 'cover', poolSize: 0 });
  const stamps = Array.from({ length: n }, (_, i) => (i + 0.5) * src.duration / n);
  const slots = stamps.map(() => { const c = document.createElement('canvas'); frames.appendChild(c); return c; });
  let i = 0;
  try {
    for await (const wc of sink.canvasesAtTimestamps(stamps)) {
      if (job !== thumbJob) return;
      const c = slots[i++];
      if (!wc || !c) continue;
      c.width = wc.canvas.width; c.height = wc.canvas.height;
      c.getContext('2d').drawImage(wc.canvas, 0, 0);
    }
  } catch {}
}

// ---- trim strip ----
function layoutTrim() {
  if (!src) return;
  const d = src.duration, a = tStart / d, b = tEnd / d;
  const pos = f => `calc(${PAD}px + (100% - ${PAD * 2}px) * ${f})`;
  $('sel').style.left = `calc(${PAD}px + (100% - ${PAD * 2}px) * ${a} - ${PAD}px)`;
  $('sel').style.right = `calc(${PAD}px + (100% - ${PAD * 2}px) * ${1 - b} - ${PAD}px)`;
  $('hL').style.left = `calc(${pos(a)} - ${PAD}px - 6px)`;
  $('hR').style.left = `calc(${pos(b)} - 6px)`;
  $('hL').style.right = $('hR').style.right = 'auto';
  $('shadeL').style.width = `calc((100% - ${PAD * 2}px) * ${a})`;
  $('shadeR').style.width = `calc((100% - ${PAD * 2}px) * ${1 - b})`;
  $('tIn').textContent = fmtT(tStart); $('tOut').textContent = fmtT(tEnd);
  $('tLen').textContent = len().toFixed(1) + ' s';
  $('hL').setAttribute('aria-valuenow', tStart.toFixed(1)); $('hR').setAttribute('aria-valuenow', tEnd.toFixed(1));
  drawHead();
}
function drawHead() {
  if (!src) return;
  const f = Math.min(1, Math.max(0, vid.currentTime / src.duration));
  $('head').style.left = `calc(${PAD}px + (100% - ${PAD * 2}px) * ${f})`;
}
function timeAt(clientX) {
  const r = $('strip').getBoundingClientRect();
  const f = (clientX - r.left - PAD) / (r.width - PAD * 2);
  return Math.min(1, Math.max(0, f)) * src.duration;
}
function setTrim(which, t) {
  if (which === 'l') tStart = Math.min(Math.max(0, t), tEnd - MIN_LEN);
  else tEnd = Math.max(Math.min(src.duration, t), tStart + MIN_LEN);
  vid.pause();
  vid.currentTime = which === 'l' ? tStart : tEnd;
  if (out) reset();
  layoutTrim(); describe();
}

let drag = null;
$('strip').addEventListener('pointerdown', e => {
  if (!src || busy) return;
  const h = e.target.closest('.h');
  drag = h ? (h.id === 'hL' ? 'l' : 'r') : 'seek';
  $('strip').setPointerCapture(e.pointerId);
  move(e);
});
$('strip').addEventListener('pointermove', e => { if (drag) move(e); });
['pointerup', 'pointercancel'].forEach(t => $('strip').addEventListener(t, () => { drag = null; }));
function move(e) {
  const t = timeAt(e.clientX);
  if (drag === 'seek') { vid.currentTime = Math.min(Math.max(t, tStart), tEnd); drawHead(); }
  else setTrim(drag, t);
}
['hL', 'hR'].forEach(id => $(id).addEventListener('keydown', e => {
  const step = e.shiftKey ? 1 : 0.1, w = id === 'hL' ? 'l' : 'r';
  if (e.key === 'ArrowLeft') { setTrim(w, (w === 'l' ? tStart : tEnd) - step); e.preventDefault(); }
  if (e.key === 'ArrowRight') { setTrim(w, (w === 'l' ? tStart : tEnd) + step); e.preventDefault(); }
}));

// ---- playback, looped inside the trim ----
function togglePlay() {
  if (!src) return;
  if (vid.paused) {
    if (vid.currentTime < tStart || vid.currentTime >= tEnd - 0.05) vid.currentTime = tStart;
    vid.play().catch(() => {});
  } else vid.pause();
}
const PLAY = '<path d="M7 4.5v15l13-7.5z"/>', PAUSE = '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>';
vid.addEventListener('play', () => { $('playIcon').innerHTML = PAUSE; $('play').setAttribute('aria-label', 'Pause'); tick(); });
vid.addEventListener('pause', () => { $('playIcon').innerHTML = PLAY; $('play').setAttribute('aria-label', 'Play'); });
function tick() {
  if (vid.paused) return;
  if (vid.currentTime >= tEnd) vid.currentTime = tStart;
  drawHead(); requestAnimationFrame(tick);
}
vid.addEventListener('seeked', drawHead);
$('play').addEventListener('click', togglePlay);
vid.addEventListener('click', togglePlay);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && src && !e.target.closest('button, input')) { e.preventDefault(); togglePlay(); }
});

// ---- encoding ----
async function encode(p) {
  const M = MBN;
  const vcodec = await M.getFirstEncodableVideoCodec(['avc', 'vp9', 'vp8'], { width: p.w, height: p.h });
  if (!vcodec) throw new Error('This browser has no video encoder. Try Chrome.');
  const mp4 = vcodec === 'avc';
  let acodec = mp4 ? 'aac' : 'opus';
  if (p.audioBps && !(await M.canEncodeAudio(acodec))) acodec = 'opus';
  const target = new M.BufferTarget();
  const conv = await M.Conversion.init({
    input: new M.Input({ source: new M.BlobSource(src.file), formats: M.ALL_FORMATS }),
    output: new M.Output({ format: mp4 ? new M.Mp4OutputFormat({ fastStart: 'in-memory' }) : new M.WebMOutputFormat(), target }),
    tracks: 'primary', showWarnings: false,
    trim: trimmed() ? { start: tStart, end: tEnd } : undefined,
    video: { width: p.w, height: p.h, fit: 'fill', frameRate: p.fps, codec: vcodec, quality: new M.Quality({ bitrate: p.videoBps, bitrateMode: 'variable' }), forceTranscode: true, keyFrameInterval: 4 },
    audio: p.audioBps ? { codec: acodec, quality: new M.Quality({ bitrate: p.audioBps }), numberOfChannels: 2, forceTranscode: true } : { discard: true },
  });
  if (!conv.isValid) throw new Error('This video can’t be converted here.');
  conv.onProgress = progress;
  await conv.execute();
  return { blob: new Blob([target.buffer], { type: mp4 ? 'video/mp4' : 'video/webm' }), ext: mp4 ? 'mp4' : 'webm' };
}

async function shrink() {
  busy = true; vid.pause();
  const g = $('go'); g.classList.add('busy'); g.disabled = true; label('Shrinking…');
  $('trim').classList.add('locked');
  const dur = len();
  try {
    let p = plan(src, dur), res, pass = 1;
    while (true) {
      progress(0);
      if (pass > 1) label('Fine-tuning…');
      res = await encode(p);
      const audio = p.audioBps * dur / 8;
      const ratio = (TARGET - audio) / Math.max(1, res.blob.size - audio);
      if (res.blob.size > LIMIT && pass < 4) { p = plan(src, dur, Math.floor(p.videoBps * ratio * 0.95)); pass++; continue; }
      if (pass === 1 && res.blob.size < TARGET * 0.75 && p.videoBps < p.srcBps * 0.9 && ratio > 1.15) {
        const prev = res; p = plan(src, dur, Math.floor(p.videoBps * Math.min(ratio * 0.9, 1.8))); pass++;
        label('Fine-tuning…'); progress(0);
        const r2 = await encode(p); res = r2.blob.size <= LIMIT ? r2 : prev;
      }
      break;
    }
    out = { blob: res.blob, name: src.file.name.replace(/\.[^.]+$/, '') + '_shrunk.' + res.ext };
    progress(0);
    g.className = 'btn done'; g.disabled = false; label('Download');
    const pct = Math.max(0, Math.round((1 - res.blob.size / src.size) * 100));
    meta(`<b>${fmt(src.size)}</b> → <b>${fmt(res.blob.size)}</b> · ${pct}% smaller`);
  } catch (e) {
    reset(); meta(e.message || String(e), true);
  } finally { busy = false; $('trim').classList.remove('locked'); }
}

async function save() {
  if (downloads) {
    try { await downloads.save({ filename: out.name, data: out.blob }); meta('Saved <b>' + out.name.replace(/</g, '&lt;') + '</b>'); }
    catch (e) { if (e?.code !== 'declined') meta('Couldn’t save the file here.', true); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out.blob); a.download = out.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  meta('Saved <b>' + out.name.replace(/</g, '&lt;') + '</b> to Downloads');
}

$('go').addEventListener('click', () => { if (busy || !src) return; out ? save() : shrink(); });

// ---- file in ----
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
$('replace').addEventListener('click', () => { if (!busy) $('file').click(); });
const stage = $('stage');
['dragenter', 'dragover'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); stage.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => window.addEventListener(t, () => stage.classList.remove('over')));
window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
window.addEventListener('resize', () => { if (src) { layoutTrim(); clearTimeout(window._rt); window._rt = setTimeout(buildThumbs, 200); } });
// "Open with Shrink" from Finder when installed as an app
if ('launchQueue' in window) launchQueue.setConsumer(async p => { if (p.files?.length) { const f = await p.files[0].getFile(); const wait = () => MBN ? loadFile(f) : setTimeout(wait, 100); wait(); } });

if (!('VideoEncoder' in window)) meta('This browser can’t encode video. Open Shrink in Chrome.', true);
else import(MEDIABUNNY_URL)
  .then(m => { MBN = m; reset(); })
  .catch(() => meta('Couldn’t load the encoder. Check your connection and reload.', true));
window.claude?.use?.('downloads').then(d => { downloads = d; }).catch(() => {});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
